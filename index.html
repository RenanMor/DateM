<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uma mensagem rápida pra você ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0f172a 70%, #030712 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary-accent: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            --btn-glow: rgba(192, 132, 252, 0.35);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            font-family: var(--font-family);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-main);
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.6;
            animation: floatSparkle 7s linear infinite;
            filter: drop-shadow(0 0 8px rgba(192, 132, 252, 0.5));
        }

        @keyframes floatSparkle {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }

            20% {
                opacity: 0.7;
            }

            80% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 420px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 30px 24px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            position: relative;
        }

        .glass-card.animate-swap {
            animation: cardSwap 0.35s ease-out forwards;
        }

        @keyframes cardSwap {
            0% {
                opacity: 0;
                transform: scale(0.94) translateY(12px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(129, 140, 248, 0.15);
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #c7d2fe;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .emoji-wrapper {
            font-size: 3.8rem;
            margin-bottom: 14px;
            display: inline-block;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
            animation: pulseEmoji 3s ease-in-out infinite;
        }

        @keyframes pulseEmoji {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 12px;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .highlight-text {
            background: linear-gradient(135deg, #a5b4fc, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 22px;
            font-weight: 400;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            position: relative;
        }

        .actions.horizontal {
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 22px;
            border-radius: 50px;
            font-family: var(--font-family);
            font-size: 0.96rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary-accent);
            color: #ffffff;
            box-shadow: 0 8px 20px var(--btn-glow);
        }

        .btn-primary:hover,
        .btn-primary:active {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 25px rgba(192, 132, 252, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .option-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-bottom: 8px;
        }

        .option-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 13px 16px;
            border-radius: 16px;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            line-height: 1.35;
        }

        .option-item:hover,
        .option-item:active {
            background: rgba(192, 132, 252, 0.18);
            border-color: rgba(192, 132, 252, 0.4);
            transform: translateX(4px);
        }

        .option-icon {
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .tease-toast {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(244, 114, 182, 0.5);
            color: #f472b6;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            pointer-events: none;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 30;
        }

        .tease-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }

        .footer-note {
            margin-top: 18px;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="ambient-bg" id="sparklesBg"></div>

    <canvas id="confettiCanvas"></canvas>

    <div class="app-container">
        <div class="tease-toast" id="teaseToast">Opção bloqueada! 😉</div>

        <div class="glass-card" id="mainCard">
            <div class="badge" id="cardBadge">
                <span id="badgeIcon">💬</span> <span id="badgeText">Oi _wermann</span>
            </div>

            <div class="emoji-wrapper" id="cardEmoji">✨</div>

            <h1 id="cardTitle">Passei aqui só pra te fazer um elogio rápido sem compromisso. <span
                    class="highlight-text">Aceita?</span></h1>

            <p class="description" id="cardDescription">
                Prometo que é algo leve e sincero pra deixar seu dia 1% melhor
            </p>

            <div id="cardContentArea">
                <div class="actions horizontal">
                    <button class="btn btn-primary" onclick="handleRespostaSim()">Sim, fiquei curiosa! ✨</button>
                    <button class="btn btn-secondary" id="btnNao">Não 😅</button>
                </div>
            </div>
        </div>

        <div class="footer-note">
            <span>Feito por ApenasRM</span>
        </div>
    </div>

    <script>
        const config = {
            whatsappLink: "https://wa.me/5514996215752?text=Oii,%20aceitei%20vir%20aqui%20%F0%9F%A4%AD"
        };

        let userChoiceText = "";

        function updateCardContent({ badgeIcon, badgeText, emoji, title, desc, contentHtml }) {
            const card = document.getElementById('mainCard');
            card.classList.remove('animate-swap');
            void card.offsetWidth;
            card.classList.add('animate-swap');

            document.getElementById('badgeIcon').innerText = badgeIcon;
            document.getElementById('badgeText').innerText = badgeText;
            document.getElementById('cardEmoji').innerText = emoji;
            document.getElementById('cardTitle').innerHTML = title;
            document.getElementById('cardDescription').innerHTML = desc;
            document.getElementById('cardContentArea').innerHTML = contentHtml;
            setTimeout(setupRunawayBtn, 50);
        }

        function handleRespostaSim() {
            updateCardContent({
                badgeIcon: "✨",
                badgeText: "Elogio Concedido",
                emoji: "😊",
                title: `Vi seu perfil/estilo e pensei: <span class="highlight-text">essa pessoa tem uma energia diferente.</span>`,
                desc: `Você passa uma autenticidade rara de encontrar por aí. E convenhamos: quando a gente nota alguém diferente, guardar o elogio seria um desperdício!<br><br><b>Agora me diz: você costuma responder mensagens inesperadas ou eu dei sorte hoje?</b>`,
                contentHtml: `
                    <div class="option-list">
                        <div class="option-item" onclick="handleVibeChoice('A', 'Deu sorte! Raramente respondo mensagens inesperadas 🍀')">
                            <span class="option-icon">🍀</span>
                            <span>Deu sorte! Raramente respondo mensagens inesperadas</span>
                        </div>
                        <div class="option-item" onclick="handleVibeChoice('B', 'Se a abordagem for criativa como a sua, eu respondo! 😉')">
                            <span class="option-icon">😉</span>
                            <span>Se a abordagem for criativa como a sua, eu respondo!</span>
                        </div>
                        <div class="option-item" onclick="handleVibeChoice('C', 'Depende do papo... o que mais você tem a dizer? 👀')">
                            <span class="option-icon">👀</span>
                            <span>Depende do papo... o que mais você tem a dizer?</span>
                        </div>
                    </div>
                `
            });
        }

        function handleVibeChoice(optionKey, optionText) {
            userChoiceText = optionText;

            let reactionTitle = "";
            let reactionDesc = "";

            if (optionKey === 'A') {
                reactionTitle = `Sorte a minha então! <span class="highlight-text">Prometo não desperdiçar.</span>`;
                reactionDesc = `Se você raramente responde, fico ainda mais animado pra te conhecer. será que tenho a sorte de receber uma notificação sua no meu whats?`;
            } else if (optionKey === 'B') {
                reactionTitle = `Ponto pra mim! <span class="highlight-text">A criatividade funcionou.</span>`;
                reactionDesc = `Fico feliz que você curtiu o estilo! Acredito que conversas boas começam exatamente assim: fora do comum e com um sorriso no rosto.`;
            } else {
                reactionTitle = `Desafio aceito! <span class="highlight-text">Gosto de quem é curiosa.</span>`;
                reactionDesc = `Você parece ainda mais interessante do que eu imaginava, e isso só me deixou com mais vontade de te conhecer melhor.`;
            }

            updateCardContent({
                badgeIcon: "🤝",
                badgeText: "Conexão Criada",
                emoji: "😉",
                title: reactionTitle,
                desc: `${reactionDesc}<br><br>Que tal levarmos essa conversa pro WhatsApp?`,
                contentHtml: `
                    <div class="actions">
                        <button class="btn btn-primary" onclick="goToFinalStep()">Bora lá! 🚀</button>
                        <button class="btn btn-secondary" onclick="handleRespostaNao()">Ainda tô pensando... 🙈</button>
                    </div>
                `
            });
        }

        function handleRespostaNao() {
            updateCardContent({
                badgeIcon: "🤝",
                badgeText: "Respeito & Vibe Leve",
                emoji: "😌",
                title: `Honesta e direta! <span class="highlight-text">Já gostei da sua postura.</span>`,
                desc: `Sem problemas nenhum. Só passei por aqui porque achei sua energia bem interessante e quis tentar um oi diferente da maioria.<br><br>Se um dia mudar de ideia ou quiser apenas trocar uma ideia sem compromisso, a porta tá aberta!`,
                contentHtml: `
                    <div class="actions">
                        <a href="${config.whatsappLink}" target="_blank" class="btn btn-primary">
                            💬 Mandar um oi amigável no Whats
                        </a>
                        <button class="btn btn-secondary" onclick="handleElogioEspecial()">
                            🙈 Calma, mudei de ideia! Quero o elogio
                        </button>
                    </div>
                `
            });
        }

        function handleElogioEspecial() {
            updateCardContent({
                badgeIcon: "🌟",
                badgeText: "Elogio Especial",
                emoji: "✨",
                title: `Sabia que a curiosidade <span class="highlight-text">ia vencer!</span>`,
                desc: `A gente passa o dia inteiro vendo centenas de perfis e pessoas passando pela tela, mas quando vi o seu, senti algo diferente. Você transmite uma presença e uma elegância muito genuína. Pessoas assim transformam qualquer conversa comum em algo especial.<br><br>Espero ter conseguido colocar aquele 1% a mais de sorriso no seu dia! 😉`,
                contentHtml: `
                    <div class="actions">
                        <a href="${config.whatsappLink}" target="_blank" class="btn btn-primary" onclick="launchConfetti()">
                            💬 Adorei! Chamar no WhatsApp
                        </a>
                        <button class="btn btn-secondary" onclick="handleRespostaSim()">
                            👀 Quero ver o resto da conversa
                        </button>
                    </div>
                `
            });

            launchConfetti();
        }

        function goToFinalStep() {
            updateCardContent({
                badgeIcon: "🎉",
                badgeText: "Sintonia Confirmada",
                emoji: "🥳",
                title: `Excelente escolha! <span class="highlight-text">Tô te esperando lá.</span>`,
                desc: `Conversas legais começam com um simples passo. Clica no botão abaixo pra me mandar uma mensagem no WhatsApp:`,
                contentHtml: `
                    <div class="actions">
                        <a href="${config.whatsappLink}" target="_blank" class="btn btn-primary">
                            💬 Abrir conversa no WhatsApp
                        </a>
                    </div>
                `
            });

            launchConfetti();
        }

        function resetToBeginning() {
            updateCardContent({
                badgeIcon: "💬",
                badgeText: "Notificação Especial",
                emoji: "✨",
                title: `Passei aqui só pra te fazer um elogio rápido sem compromisso. <span class="highlight-text">Aceita?</span>`,
                desc: `Prometo que é algo leve e sincero pra deixar sua conversa mais interessante hoje.`,
                contentHtml: `
                    <div class="actions horizontal">
                        <button class="btn btn-primary" onclick="handleRespostaSim()">Sim, fiquei curiosa(o)! ✨</button>
                        <button class="btn btn-secondary" onclick="handleRespostaNao()">Não, prefiro não arriscar... 😅</button>
                    </div>
                `
            });
        }

        function createAmbientSparkles() {
            const container = document.getElementById('sparklesBg');
            const symbols = ['✨', '⭐', '💫', '🌟', '🔹'];

            for (let i = 0; i < 18; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                sparkle.style.left = `${Math.random() * 100}vw`;
                sparkle.style.animationDuration = `${5 + Math.random() * 6}s`;
                sparkle.style.animationDelay = `${Math.random() * 4}s`;
                sparkle.style.fontSize = `${0.8 + Math.random() * 0.8}rem`;
                container.appendChild(sparkle);
            }
        }

        function launchConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#818cf8', '#c084fc', '#f472b6', '#38bdf8', '#fbbf24', '#ffffff'];

            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 40,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 1.2) * 11,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 12,
                    opacity: 1
                });
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let stillActive = false;

                particles.forEach(p => {
                    if (p.opacity <= 0) return;
                    stillActive = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.26;
                    p.opacity -= 0.012;
                    p.rotation += p.rSpeed;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.globalAlpha = Math.max(0, p.opacity);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (stillActive) {
                    requestAnimationFrame(render);
                }
            }

            render();
        }

        let runawayAttempts = 0;

        const teaseMessages = [
            "Ops! Botão desativado! 🙈",
            "Nem tenta clicar! 😂",
            "Tenta o outro botão, é mais legal 😉",
            "Calma lá! Aceita o elogio primeiro ✨",
            "Botão arisco detectado! 🚀",
            "Sem chance de recusar uma boa vibe! 💫"
        ];

        function setupRunawayBtn() {
            const btnNao = document.getElementById('btnNao');
            const mainCard = document.getElementById('mainCard');
            if (!btnNao || !mainCard) return;

            const triggerFlee = (e) => {
                runawayAttempts++;
                showTeaseToast(teaseMessages[runawayAttempts % teaseMessages.length]);

                const cardRect = mainCard.getBoundingClientRect();
                const btnRect = btnNao.getBoundingClientRect();

                const padding = 20;
                const maxX = cardRect.width - btnRect.width - padding;
                const maxY = cardRect.height - btnRect.height - padding;

                let randomX = Math.floor(Math.random() * (maxX - padding)) + padding - (cardRect.width / 2) + (btnRect.width / 2);
                let randomY = Math.floor(Math.random() * (maxY - padding)) + padding - (cardRect.height / 2) + (btnRect.height / 2);

                btnNao.style.position = 'absolute';
                btnNao.style.zIndex = '20';
                btnNao.style.transition = 'all 0.15s ease-out';
                btnNao.style.left = `${randomX}px`;
                btnNao.style.top = `${randomY}px`;
            };

            btnNao.addEventListener('mouseenter', triggerFlee);
            btnNao.addEventListener('touchstart', (e) => {
                e.preventDefault();
                triggerFlee(e);
            });
            btnNao.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                triggerFlee(e);
                return false;
            });
        }

        document.addEventListener('mousemove', (e) => {
            const btnNao = document.getElementById('btnNao');
            if (!btnNao) return;
            const rect = btnNao.getBoundingClientRect();
            if (rect.width === 0) return;
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;

            const dist = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);
            if (dist < 70) {
                runawayAttempts++;
                showTeaseToast(teaseMessages[runawayAttempts % teaseMessages.length]);

                const mainCard = document.getElementById('mainCard');
                const cardRect = mainCard.getBoundingClientRect();

                const padding = 20;
                const maxX = cardRect.width - rect.width - padding;
                const maxY = cardRect.height - rect.height - padding;

                let randomX = Math.floor(Math.random() * (maxX - padding)) + padding - (cardRect.width / 2) + (rect.width / 2);
                let randomY = Math.floor(Math.random() * (maxY - padding)) + padding - (cardRect.height / 2) + (rect.height / 2);

                btnNao.style.position = 'absolute';
                btnNao.style.zIndex = '20';
                btnNao.style.transition = 'all 0.15s ease-out';
                btnNao.style.left = `${randomX}px`;
                btnNao.style.top = `${randomY}px`;
            }
        });

        function showTeaseToast(msg) {
            const toast = document.getElementById('teaseToast');
            if (!toast) return;
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }

        window.addEventListener('load', () => {
            createAmbientSparkles();
            setupRunawayBtn();
        });

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confettiCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
